<!--
  Unit Entry Tracker Web App (v2.1.0)
  Connected to Google Sheet tab: TCN_Data
  The tab name is set in Code.gs as: var SHEET_TAB_NAME = 'TCN_Data';
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Entry Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        .hidden { display: none; }
        .button-group button { margin: 0.5em; padding: 1em 2em; font-size: 1em; }
        .error { color: red; margin-top: 0.5em; }
        table { border-collapse: collapse; margin-top: 2em; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 0.5em 1em; text-align: left; }
        th { background: #f0f0f0; }
        .table-controls { margin: 1em 0; }
        .table-controls button { margin-right: 1em; }
        #version-banner { font-weight: bold; padding: 0.5em 1em; margin-bottom: 1em; border-radius: 4px; background: #eee; color: #333; }
        #version-banner.ok { background: #2ecc40; color: #fff; }
        #status-line { margin-top: 1em; font-size: 1em; color: #0074d9; }
    </style>
</head>
<body>
    <!-- VERSION BANNER -->
    <div id="version-banner">v2.1.0 — Unit Entry Tracker | Connected to tab: <b>TCN_Data</b> | JS status: (waiting…)</div>
    <div id="start-page">
        <button id="start-entry-btn">Start New Entry</button>
    </div>
    <div id="unit-selection-page" class="hidden">
        <h2>Select Unit</h2>
        <div class="button-group">
            <button class="unit-btn" data-unit="HHT BDE">HHT BDE</button>
            <button class="unit-btn" data-unit="6-9CAV">6-9CAV</button>
            <button class="unit-btn" data-unit="2-7CAV">2-7CAV</button>
            <button class="unit-btn" data-unit="215 BSB">215 BSB</button>
            <button class="unit-btn" data-unit="3 BEB">3 BEB</button>
            <button class="unit-btn" data-unit="3-8">3-8</button>
            <button class="unit-btn" data-unit="1-12CAV">1-12CAV</button>
            <button class="unit-btn" data-unit="2-82FA">2-82FA</button>
        </div>
    </div>
    <div id="bumper-entry-page" class="hidden">
        <h2>Enter Bumper Number</h2>
        <form id="bumper-form" autocomplete="off">
            <input type="text" id="bumper-input" maxlength="20" pattern="[A-Za-z0-9]+" required placeholder="Bumper Number (letters/numbers only)">
            <button type="submit">Submit</button>
        </form>
        <div id="bumper-error" class="error"></div>
    </div>
    <div id="ship-selection-page" class="hidden">
        <h2>Select Ship</h2>
        <div class="button-group">
            <button class="ship-btn" data-ship="At port">At port</button>
            <button class="ship-btn" data-ship="Green Bay">Green Bay</button>
            <button class="ship-btn" data-ship="Green Ocean">Green Ocean</button>
            <button class="ship-btn" data-ship="ARC Integrity">ARC Integrity</button>
            <button class="ship-btn" data-ship="Boat 4">Boat 4</button>
        </div>
    </div>
    <div id="entries-section">
        <div class="table-controls">
            <button id="export-csv-btn">Export as CSV</button>
            <button id="clear-table-btn">Clear Table</button>
        </div>
        <table id="entries-table">
            <thead>
                <tr>
                    <th>Unit</th>
                    <th>Bumper Number</th>
                    <th>Ship</th>
                    <th>Timestamp</th>
                    <th>Sheet Update</th>
                </tr>
            </thead>
            <tbody>
                <!-- Entries will be inserted here -->
            </tbody>
        </table>
        <div id="status-line"></div>
    </div>
    <script>
        // DOM-based HTML escaping for XSS safety
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        // CSV formula-injection protection
        function csvSafe(field) {
            const dangerous = /^[=+\-@\t\r]/;
            let s = String(field);
            if (dangerous.test(s)) s = "'" + s;
            return '"' + s.replace(/"/g, '""') + '"';
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Version banner status
            const versionBanner = document.getElementById('version-banner');
            versionBanner.classList.add('ok');
            versionBanner.innerHTML = 'v2.1.0 — Unit Entry Tracker | Connected to tab: <b>TCN_Data</b> | JS status: <b>RUNNING ✓</b> — Ready';

            const startPage = document.getElementById('start-page');
            const unitSelectionPage = document.getElementById('unit-selection-page');
            const bumperEntryPage = document.getElementById('bumper-entry-page');
            const shipSelectionPage = document.getElementById('ship-selection-page');
            const entriesSection = document.getElementById('entries-section');
            const startEntryBtn = document.getElementById('start-entry-btn');
            const bumperForm = document.getElementById('bumper-form');
            const bumperInput = document.getElementById('bumper-input');
            const bumperError = document.getElementById('bumper-error');
            const entriesTableBody = document.querySelector('#entries-table tbody');
            const exportCsvBtn = document.getElementById('export-csv-btn');
            const clearTableBtn = document.getElementById('clear-table-btn');
            const statusLine = document.getElementById('status-line');

            let selectedUnit = null;
            let bumperNumber = null;
            let entries = [];

            function showStartPage() {
                startPage.classList.remove('hidden');
                unitSelectionPage.classList.add('hidden');
                bumperEntryPage.classList.add('hidden');
                shipSelectionPage.classList.add('hidden');
            }

            function updateTable() {
                entriesTableBody.innerHTML = '';
                entries.forEach(entry => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${escapeHTML(entry.unit)}</td><td>${escapeHTML(entry.bumper)}</td><td>${escapeHTML(entry.ship)}</td><td>${escapeHTML(entry.timestamp)}</td><td>${escapeHTML(entry.sheetStatus)}</td>`;
                    entriesTableBody.appendChild(tr);
                });
            }

            function resetEntryState() {
                selectedUnit = null;
                bumperNumber = null;
            }

            startEntryBtn.addEventListener('click', function() {
                startPage.classList.add('hidden');
                unitSelectionPage.classList.remove('hidden');
            });

            document.querySelectorAll('.unit-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    selectedUnit = btn.getAttribute('data-unit');
                    unitSelectionPage.classList.add('hidden');
                    bumperEntryPage.classList.remove('hidden');
                    bumperInput.value = '';
                    bumperError.textContent = '';
                    bumperInput.focus();
                });
            });

            bumperForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const value = bumperInput.value.trim();
                if (!/^[A-Za-z0-9]+$/.test(value)) {
                    bumperError.textContent = 'Only letters and numbers are allowed. No spaces or dashes.';
                    return;
                }
                bumperError.textContent = '';
                bumperNumber = value;
                bumperEntryPage.classList.add('hidden');
                shipSelectionPage.classList.remove('hidden');
            });

            document.querySelectorAll('.ship-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const selectedShip = btn.getAttribute('data-ship');
                    const timestamp = new Date().toISOString();
                    // Add entry to table immediately with pending status
                    const entry = {
                        unit: selectedUnit,
                        bumper: bumperNumber,
                        ship: selectedShip,
                        timestamp: timestamp,
                        sheetStatus: 'Saving…'
                    };
                    entries.push(entry);
                    updateTable();
                    resetEntryState();
                    shipSelectionPage.classList.add('hidden');
                    showStartPage();
                    statusLine.textContent = 'Saving to Google Sheet…';
                    // Call server to update sheet
                    google.script.run
                        .withSuccessHandler(function(result) {
                            entry.sheetStatus = result && result.status ? result.status : 'ERROR';
                            updateTable();
                            statusLine.textContent = result && result.message ? result.message : 'Unknown server response.';
                        })
                        .withFailureHandler(function(err) {
                            entry.sheetStatus = 'ERROR';
                            updateTable();
                            statusLine.textContent = 'Server error: ' + (err && err.message ? err.message : err);
                        })
                        .recordEntry({
                            unit: entry.unit,
                            bumper: entry.bumper,
                            ship: entry.ship,
                            timestamp: entry.timestamp
                        });
                });
            });

            exportCsvBtn.addEventListener('click', function() {
                if (entries.length === 0) {
                    statusLine.textContent = 'No entries to export.';
                    return;
                }
                let csv = 'Unit,Bumper Number,Ship,Timestamp,Sheet Update\n';
                entries.forEach(entry => {
                    const row = [entry.unit, entry.bumper, entry.ship, entry.timestamp, entry.sheetStatus].map(csvSafe).join(',');
                    csv += row + '\n';
                });
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'entries.csv';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 0);
                statusLine.textContent = 'CSV exported.';
            });

            clearTableBtn.addEventListener('click', function() {
                if (confirm('Are you sure you want to clear all entries?')) {
                    entries = [];
                    updateTable();
                    statusLine.textContent = 'Table cleared.';
                }
            });

            // Show table at start, even if empty
            updateTable();
        });
    </script>
</body>
</html>
