<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Barcode Scanner to CSV (Mobile Friendly)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        #main-row {
            display: flex; flex-direction: row;
            align-items: flex-start; margin-bottom: 20px;
        }
        #scanner-container {
            width: 100vw; max-width: 400px;
            height: 40vh; max-height: 300px;
            position: relative; display: block;
            margin-right: 16px; overflow: hidden; background: #222;
        }
        #scanner-container video,
        #scanner-container canvas {
            width: 100% !important; height: 100% !important;
            object-fit: cover; position: absolute;
            top: 0; left: 0; z-index: 1;
        }
        #blackout-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            background: #000; opacity: 0;
            pointer-events: none; transition: opacity 0.1s; z-index: 10;
        }
        #button-column { display: flex; flex-direction: column; gap: 16px; }
        button {
            min-width: 120px; min-height: 44px;
            font-size: 1.1em; border-radius: 8px;
            border: 1px solid #888; background: #f0f0f0;
        }
        #scans-table { border-collapse: collapse; width: 100%; }
        #scans-table th, #scans-table td { border: 1px solid #ccc; padding: 8px; }
        #status-message {
            margin: 10px 0; padding: 8px;
            font-weight: bold; min-height: 1.2em;
        }
        .status-success { color: green; }
        .status-error { color: red; }
        .status-info { color: #333; }
        #popup-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #popup {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.2);
            text-align: center;
        }
        #popup button {
            margin: 12px;
            min-width: 100px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <h2>Barcode Scanner (Mobile Friendly)</h2>
    <div id="main-row">
        <div id="scanner-container">
            <div id="blackout-overlay"></div>
        </div>
        <div id="button-column">
            <button id="start-btn">Start Scanning</button>
            <button id="stop-btn">Stop Scanning</button>
            <button id="export-btn">Export CSV</button>
            <button id="reset-btn">Reset CSV</button>
        </div>
    </div>
    <div id="status-message" class="status-info">Ready to scan.</div>
    <h3>Scanned Barcodes</h3>
    <table id="scans-table">
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Barcode</th>
                <th>Status</th>
                <th>Sheet Status</th>
            </tr>
        </thead>
        <tbody id="scans-body"></tbody>
    </table>

    <!-- Popup overlay for status selection -->
    <div id="popup-overlay">
        <div id="popup">
            <div id="popup-barcode"></div>
            <button id="popup-atport">At port</button>
            <button id="popup-loaded">Loaded</button>
        </div>
    </div>

    <script src="https://unpkg.com/@ericblade/quagga2/dist/quagga.min.js"></script>
    <script>
        // ===== CONFIGURATION =====
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzbXg-vp6HJIzxNsESSBfv5jsBD9E246kF1yMuiy4IediDpGLWbJiV9v5T3uUsTB-zMDA/exec";
        const REQUIRED_PREFIX = "AW";
        const MIN_BARCODE_LENGTH = 7; // must be GREATER than this

        let scans = [];
        let lastResults = [];
        let currentVideoTrack = null;
        const DEBOUNCE_COUNT = 3;
        let pendingBarcode = null;
        let pendingTimestamp = null;

        function setStatus(message, type) {
            const el = document.getElementById('status-message');
            el.textContent = message;
            el.className = 'status-' + (type || 'info');
        }

        function isValidBarcode(barcode) {
            if (typeof barcode !== 'string') return false;
            if (barcode.length <= MIN_BARCODE_LENGTH) return false;
            if (barcode.length > 100) return false;
            if (!barcode.startsWith(REQUIRED_PREFIX)) return false;
            return true;
        }

        function showPopup(barcode, timestamp) {
            pendingBarcode = barcode;
            pendingTimestamp = timestamp;
            document.getElementById('popup-barcode').textContent = `Barcode: ${barcode}`;
            document.getElementById('popup-overlay').style.display = 'flex';
        }

        function hidePopup() {
            document.getElementById('popup-overlay').style.display = 'none';
            pendingBarcode = null;
            pendingTimestamp = null;
        }

        function addScan(barcode, timestamp, status) {
            scans.push({ timestamp, barcode, status });
            const row = document.createElement('tr');
            const tsCell = document.createElement('td');
            tsCell.textContent = timestamp;
            const bcCell = document.createElement('td');
            bcCell.textContent = barcode;
            const statusCell = document.createElement('td');
            statusCell.textContent = status;
            const sheetStatusCell = document.createElement('td');
            sheetStatusCell.textContent = 'Sending...';
            sheetStatusCell.style.color = '#666';
            row.appendChild(tsCell);
            row.appendChild(bcCell);
            row.appendChild(statusCell);
            row.appendChild(sheetStatusCell);
            document.getElementById('scans-body').appendChild(row);
            blackoutScanner();
            sendBarcodeToSheet(barcode, timestamp, status, sheetStatusCell);
        }

        function blackoutScanner() {
            const overlay = document.getElementById('blackout-overlay');
            overlay.style.opacity = '1';
            setTimeout(() => { overlay.style.opacity = '0'; }, 500);
        }

        async function sendBarcodeToSheet(barcode, timestamp, status, sheetStatusCell) {
            if (!isValidBarcode(barcode)) {
                if (sheetStatusCell) {
                    sheetStatusCell.textContent = 'Invalid barcode';
                    sheetStatusCell.style.color = 'red';
                }
                return;
            }
            try {
                const payload = JSON.stringify({ barcode: barcode, timestamp: timestamp, status: status });
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: payload,
                    redirect: 'follow'
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const result = await response.json();
                if (result.success) {
                    if (sheetStatusCell) {
                        sheetStatusCell.textContent = 'Loaded (row ' + result.row + ')';
                        sheetStatusCell.style.color = 'green';
                    }
                    setStatus('Marked as ' + status + ': ' + barcode, 'success');
                } else {
                    if (sheetStatusCell) {
                        sheetStatusCell.textContent = result.error || 'Not found';
                        sheetStatusCell.style.color = 'red';
                    }
                    setStatus('Sheet update failed: ' + (result.error || 'Unknown'), 'error');
                }
            } catch (err) {
                console.warn('Sheet update error:', err);
                if (sheetStatusCell) {
                    sheetStatusCell.textContent = 'Network error';
                    sheetStatusCell.style.color = 'red';
                }
                setStatus('Could not reach Google Sheet.', 'error');
            }
        }

        async function enableTorch() {
            try {
                const videoElem = document.querySelector('#scanner-container video');
                if (!videoElem || !videoElem.srcObject) return;
                const tracks = videoElem.srcObject.getVideoTracks();
                if (!tracks || tracks.length === 0) return;
                currentVideoTrack = tracks[0];
                const capabilities = currentVideoTrack.getCapabilities
                    ? currentVideoTrack.getCapabilities() : {};
                if (capabilities.torch) {
                    await currentVideoTrack.applyConstraints({ advanced: [{ torch: true }] });
                }
            } catch (err) { console.warn('Unable to enable torch:', err); }
        }

        async function disableTorch() {
            try {
                if (currentVideoTrack) {
                    const capabilities = currentVideoTrack.getCapabilities
                        ? currentVideoTrack.getCapabilities() : {};
                    if (capabilities.torch) {
                        await currentVideoTrack.applyConstraints({ advanced: [{ torch: false }] });
                    }
                }
            } catch (err) { console.warn('Unable to disable torch:', err); }
            finally { currentVideoTrack = null; }
        }

        function startScanner() {
            setStatus('Starting scanner...', 'info');
            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: document.querySelector('#scanner-container'),
                    constraints: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: "environment"
                    }
                },
                decoder: {
                    readers: [
                        "code_128_reader","ean_reader","ean_8_reader",
                        "code_39_reader","code_39_vin_reader","codabar_reader",
                        "upc_reader","upc_e_reader","i2of5_reader",
                        "2of5_reader","code_93_reader"
                    ],
                    locate: true
                }
            }, function(err) {
                if (err) {
                    setStatus('Error initializing scanner.', 'error');
                    alert("Error initializing scanner: " + err);
                    return;
                }
                Quagga.start();
                setStatus('Scanning for barcodes starting with "AW"...', 'info');
                setTimeout(enableTorch, 500);
            });
            Quagga.onDetected(onDetectedHandler);
        }

        async function stopScanner() {
            Quagga.offDetected(onDetectedHandler);
            await disableTorch();
            Quagga.stop();
            lastResults = [];
            setStatus('Scanner stopped.', 'info');
        }

        function onDetectedHandler(result) {
            const barcode = result.codeResult.code;
            if (!isValidBarcode(barcode)) return;
            lastResults.push(barcode);
            if (lastResults.length > DEBOUNCE_COUNT) lastResults.shift();
            if (lastResults.length === DEBOUNCE_COUNT &&
                lastResults.every(val => val === lastResults[0])) {
                if (!scans.length || scans[scans.length - 1].barcode !== barcode) {
                    const timestamp = new Date().toISOString();
                    showPopup(barcode, timestamp);
                }
                lastResults = [];
            }
        }

        function exportCSV() {
            let csvContent = "Timestamp,Barcode,Status\n";
            scans.forEach(scan => {
                const safeTs = String(scan.timestamp).replace(/"/g, '""');
                const safeBc = String(scan.barcode).replace(/"/g, '""');
                const safeStatus = String(scan.status).replace(/"/g, '""');
                csvContent += `"${safeTs}","${safeBc}","${safeStatus}"\n`;
            });
            const blob = new Blob([csvContent], { type: "text/csv" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "scanned_barcodes.csv";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function resetCSV() {
            scans = [];
            document.getElementById('scans-body').innerHTML = '';
            lastResults = [];
            setStatus('Scan list cleared.', 'info');
        }

        document.getElementById('start-btn').addEventListener('click', startScanner);
        document.getElementById('stop-btn').addEventListener('click', stopScanner);
        document.getElementById('export-btn').addEventListener('click', exportCSV);
        document.getElementById('reset-btn').addEventListener('click', resetCSV);

        // Popup button handlers
        document.getElementById('popup-atport').addEventListener('click', function() {
            if (pendingBarcode && pendingTimestamp) {
                addScan(pendingBarcode, pendingTimestamp, 'At port');
            }
            hidePopup();
        });
        document.getElementById('popup-loaded').addEventListener('click', function() {
            if (pendingBarcode && pendingTimestamp) {
                addScan(pendingBarcode, pendingTimestamp, 'Loaded');
            }
            hidePopup();
        });
    </script>
</body>
</html>
