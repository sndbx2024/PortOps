<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Barcode Scanner to CSV (Mobile Friendly)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }
        #main-row {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        #scanner-container {
            width: 100vw;
            max-width: 400px;
            height: 40vh;
            max-height: 300px;
            position: relative;
            display: block;
            margin-right: 16px;
            overflow: hidden;
            background: #222;
        }
        #scanner-container video,
        #scanner-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }
        #blackout-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
            z-index: 10;
        }
        #button-column {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        button {
            min-width: 120px;
            min-height: 44px;
            font-size: 1.1em;
            border-radius: 8px;
            border: 1px solid #888;
            background: #f0f0f0;
        }
        #scans-table { border-collapse: collapse; width: 100%; }
        #scans-table th, #scans-table td { border: 1px solid #ccc; padding: 8px; }
        @media (max-width: 700px) {
            #main-row {
                flex-direction: column;
                align-items: stretch;
            }
            #scanner-container {
                width: 100vw;
                max-width: 100vw;
                height: 40vh;
                max-height: 40vh;
                margin-right: 0;
                margin-bottom: 16px;
            }
            #button-column {
                flex-direction: row;
                gap: 8px;
                justify-content: center;
            }
            button {
                min-width: 80px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <h2>Barcode Scanner (Mobile Friendly)</h2>
    <div id="main-row">
        <div id="scanner-container">
            <div id="blackout-overlay"></div>
        </div>
        <div id="button-column">
            <button id="start-btn">Start Scanning</button>
            <button id="stop-btn">Stop Scanning</button>
            <button id="export-btn">Export CSV</button>
            <button id="reset-btn">Reset CSV</button>
        </div>
    </div>
    <h3>Scanned Barcodes</h3>
    <table id="scans-table">
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Barcode</th>
            </tr>
        </thead>
        <tbody id="scans-body"></tbody>
    </table>

    <!-- QuaggaJS CDN -->
    <script src="https://unpkg.com/@ericblade/quagga2/dist/quagga.min.js"></script>
    <script>
        let scans = [];
        let lastResults = [];
        const DEBOUNCE_COUNT = 3; // Require 3 identical consecutive scans

        // Replace with your actual Google Apps Script Web App URL
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzbXg-vp6HJIzxNsESSBfv5jsBD9E246kF1yMuiy4IediDpGLWbJiV9v5T3uUsTB-zMDA/exec';

        function addScan(barcode) {
            const timestamp = new Date().toISOString();
            scans.push({ timestamp, barcode });
            const row = document.createElement('tr');
            row.innerHTML = `<td>${timestamp}</td><td>${barcode}</td>`;
            document.getElementById('scans-body').appendChild(row);
            blackoutScanner();
            // Send to Google Sheet as well
            sendBarcodeToSheet(barcode, timestamp);
        }

        function sendBarcodeToSheet(barcode, timestamp) {
            // Input validation
            if (typeof barcode !== 'string' || barcode.length === 0) {
                console.error('Invalid barcode');
                return;
            }
            if (typeof timestamp !== 'string' || isNaN(Date.parse(timestamp))) {
                console.error('Invalid timestamp');
                return;
            }
            // Prepare the data as JSON
            const data = {
                barcode: barcode,
                timestamp: timestamp
            };
            // Send POST request
            fetch(WEB_APP_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(result => {
                if (result.success) {
                    console.log('Barcode updated in Google Sheet successfully.');
                } else {
                    console.error('Error updating Google Sheet:', result.error);
                }
            })
            .catch(error => {
                console.error('Network or server error:', error);
            });
        }

        function blackoutScanner() {
            const overlay = document.getElementById('blackout-overlay');
            overlay.style.opacity = '1';
            setTimeout(() => {
                overlay.style.opacity = '0';
            }, 500); // 0.5 seconds
        }

        function startScanner() {
            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: document.querySelector('#scanner-container'),
                    constraints: {
                        width: window.innerWidth > 400 ? 400 : window.innerWidth,
                        height: window.innerHeight > 300 ? 300 : Math.floor(window.innerHeight * 0.4),
                        facingMode: "environment" 
                    }
                },
                decoder: {
                    readers: [
                        "code_128_reader",
                        "ean_reader",
                        "ean_8_reader",
                        "code_39_reader",
                        "code_39_vin_reader",
                        "codabar_reader",
                        "upc_reader",
                        "upc_e_reader",
                        "i2of5_reader",
                        "2of5_reader",
                        "code_93_reader"
                    ],
                    locate: true
                }
            }, function(err) {
                if (err) {
                    alert("Error initializing scanner: " + err);
                    return;
                }
                Quagga.start();
            });

            Quagga.onDetected(onDetectedHandler);
        }

        function stopScanner() {
            Quagga.offDetected(onDetectedHandler);
            Quagga.stop();
            lastResults = [];
        }

        function onDetectedHandler(result) {
            const barcode = result.codeResult.code;
            lastResults.push(barcode);
            if (lastResults.length > DEBOUNCE_COUNT) {
                lastResults.shift();
            }
            if (
                lastResults.length === DEBOUNCE_COUNT &&
                lastResults.every(val => val === lastResults[0])
            ) {
                if (!scans.length || scans[scans.length - 1].barcode !== barcode) {
                    addScan(barcode);
                }
                lastResults = [];
            }
        }

        function exportCSV() {
            let csvContent = "Timestamp,Barcode\n";
            scans.forEach(scan => {
                csvContent += `"${scan.timestamp}","${scan.barcode}"\n`;
            });
            const blob = new Blob([csvContent], { type: "text/csv" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "scanned_barcodes.csv";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function resetCSV() {
            scans = [];
            document.getElementById('scans-body').innerHTML = '';
            lastResults = [];
        }

        document.getElementById('start-btn').addEventListener('click', startScanner);
        document.getElementById('stop-btn').addEventListener('click', stopScanner);
        document.getElementById('export-btn').addEventListener('click', exportCSV);
        document.getElementById('reset-btn').addEventListener('click', resetCSV);
    </script>
</body>
</html>
